name: ditonton
description: Movie and TV series catalogue built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  core:
    path: core
  movie:
    path: movie
  tv_series:
    path: tv_series
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  http: ^1.6.0
  firebase_core: ^4.15.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
flutter:
  uses-material-design: true
